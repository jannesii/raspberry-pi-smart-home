[project]
name = "jannenkoti"
version = "1.0.0"
requires-python = ">=3.11"

# =============================================================================
# Ruff Configuration - Fast Python Linter & Formatter
# =============================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app"]

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
    ".mypy_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
# Enable rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
]

# Ignore rules that are too strict for this project
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function call in argument defaults (Flask patterns)
    "B904",   # Within except clause, raise from err (too verbose sometimes)
    "SIM108", # Use ternary operator (readability preference)
    "UP007",  # Use X | Y for Union (keep compatibility)
    "E402",   # Module level import not at top of file (Flask patterns)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-single-line = false
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Allow unused imports in __init__.py files (they're re-exports)
"__init__.py" = ["F401", "F403"]
# Tests can have magic values and assertions
"test_*.py" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
