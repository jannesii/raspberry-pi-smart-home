; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Plain `pio run` (and `-t upload`) targets the device only; the native
; env is for host tests: `pio test -e native`.
default_envs = seeed_xiao_esp32c3

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
lib_deps =
	bblanchon/ArduinoJson@^7.4.2
	links2004/WebSockets@^2.4.1
; CORE_DEBUG_LEVEL=1 prints core error logs, exposing TLS handshake failures.
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=1

; Host-side tests for the sensor measurement boundary (no hardware needed):
;   pio test -e native
[env:native]
platform = native
test_framework = unity
lib_deps =
	bblanchon/ArduinoJson@^7.4.2
build_flags =
	-std=gnu++17
