# Installed as /etc/tmpfiles.d/jannenkoti-tests.conf on the Pi.
# Test runs (release preparation and development) leave large directories in
# the RAM-backed /tmp; systemd-tmpfiles-clean.timer removes anything in them
# unused for a day, instead of the general ten days.
e /tmp/pytest-of-* - - - 1d
e /tmp/server-tests-* - - - 1d
